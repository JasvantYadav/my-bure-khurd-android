name: Build My Bure Khurd APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q My_Bure_Khurd_Android_GitHub_APK_Builder.zip -d extracted
          PROJECT=$(find extracted -maxdepth 2 -type f -name settings.gradle | head -n 1 | xargs dirname)
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT }}
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Bure-Khurd-APK
          path: '${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk'
